[package]
name = "openicue-setup"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[[bin]]
name = "openiCUE-Setup"
path = "src/main.rs"
test = false

[features]
# Embeds the release binaries and PawnIO. Only scripts/build-setup.ps1 turns it on.
payload = []
# Test builds only: corrupts the embedded PawnIO copy in memory, to show the failure path.
tamper-test = ["payload"]

[dependencies]
openicue-core = { path = "../core" }
openicue-gdi = { path = "../gdi" }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
