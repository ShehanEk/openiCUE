[package]
name = "openicue"
version = "0.1.0"
edition = "2021"

[dependencies]
openicue-core = { path = "../core" }
openicue-gdi = { path = "../gdi" }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# The binary has no tests, and its test harness would get the admin manifest
# from build.rs, so `cargo test` could not start it unelevated.
[[bin]]
name = "openicue"
path = "src/main.rs"
test = false
